# A Proxmox host's guests: a button on each running LXC and VM in its Running list.
# docs/reference/plugin-schema.md is the format.
name: Proxmox
description: Reboot or shut down a running LXC or VM.
requires: [pct, qm]
actions:
  reboot-lxc:
    label: Reboot
    description: Reboot this LXC.
    target: lxc
    run: sudo pct reboot "$1"
  shutdown-lxc:
    label: Shut down
    description: Shut this LXC down cleanly.
    target: lxc
    confirm: It stays off until it is started again.
    run: sudo pct shutdown "$1"
  reboot-vm:
    label: Reboot
    description: Reboot this VM.
    target: vm
    run: sudo qm reboot "$1"
  shutdown-vm:
    label: Shut down
    description: Shut this VM down cleanly.
    target: vm
    confirm: It stays off until it is started again.
    run: sudo qm shutdown "$1"
