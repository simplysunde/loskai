# git on the machine: who the commits made there are by, and its projects — the git repos in
# its projects folder ($PROJECTS), which Claude Code finds its projects in too: clone one,
# pull or push it, or open a shell in it. They run in the machine's terminal as its SSH
# user, so a remote over SSH uses that user's own key and asks to trust a new host there,
# and one over HTTPS asks for its login there when it needs one — Pull and Push are
# automatic, so that is in the drop-down, which says Done or Failed with git's last lines
# (a closed window never leaves one waiting to be attached to). That user's keys are in
# Keys: each one's Copy (the page's, from the overview), Test and Delete, a new account
# key, a key for a host, and a test on any host. A
# project can have its own commit name, email and key — a deploy key — in place of the
# machine's.
# docs/reference/tool-schema.md is the format.
name: Git
description: Your projects' git — clone, pull, push — and who commits made on it are by.
requires: [git]
settings:
  name:
    label: Name
    description: Git's global user.name — a project can set its own.
    value: git-name
    read: git config --global user.name
    write: git config --global user.name "$1"
  email:
    label: Email
    description: Git's global user.email — a project can set its own.
    value: email
    read: git config --global user.email
    write: git config --global user.email "$1"
  # A project's own, in place of the global ones; taking it off leaves the global one. Git
  # says 5 when there was nothing to take off.
  project-name:
    label: Name
    description: Who this project's commits are by — empty, the global name.
    target: project
    overrides: name
    value: git-name
    read: git -C "$PROJECTS/$1" config --local user.name
    write: git -C "$PROJECTS/$1" config --local user.name "$2"
    unset: git -C "$PROJECTS/$1" config --local --unset user.name; s=$?; [ $s = 0 ] || [ $s = 5 ]
  project-email:
    label: Email
    description: The address on this project's commits — empty, the global email.
    target: project
    overrides: email
    value: email
    read: git -C "$PROJECTS/$1" config --local user.email
    write: git -C "$PROJECTS/$1" config --local user.email "$2"
    unset: git -C "$PROJECTS/$1" config --local --unset user.email; s=$?; [ $s = 0 ] || [ $s = 5 ]
actions:
  pull:
    label: Pull
    description: Bring in what was pushed from elsewhere — only when it fast-forwards, never a merge.
    target: project
    automatic: true
    run: cd "$PROJECTS/$1" && git pull --ff-only
  push:
    label: Push
    description: Send this project's commits to its remote.
    target: project
    automatic: true
    run: cd "$PROJECTS/$1" && git push
  terminal:
    label: Terminal
    description: A shell in this project.
    target: project
    session: false
    run: cd "$PROJECTS/$1" && exec "${SHELL:-sh}" -l
  # A project's own key, in its settings: Machine's key takes it off again and keeps the
  # file, so Give it its own key takes the same one up — a key already on the repository's Deploy keys.
  own-key:
    label: Own key
    description: >-
      Give this project its own SSH key — a deploy key, for its repository alone — in place
      of the machine's, made first when there is none, and shown to add to the repository.
    target: project
    session: false
    place: settings
    run: >-
      cd "$PROJECTS/$1" || exit 1;
      command -v ssh-keygen >/dev/null || { echo "No ssh-keygen on this machine: install OpenSSH's client."; exit 1; };
      k="$HOME/.ssh/deploy_$1";
      if [ -f "$k" ]; then [ -f "$k.pub" ] || ssh-keygen -y -f "$k" > "$k.pub" || exit 1;
      echo "$1's own key, kept from before:";
      else mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
      ssh-keygen -q -t ed25519 -N "" -C "$(id -un)@$(hostname) (loskai: deploy $1)" -f "$k" </dev/null || exit 1;
      echo "Made $1 its own key, with no passphrase:"; fi;
      git config --local core.sshCommand "ssh -i '$k' -o IdentitiesOnly=yes" || exit 1;
      echo; cat "$k.pub"; echo;
      echo "Add it to the repository's Deploy keys (its Settings › Deploy keys), with write";
      echo "access to push. From now on git uses only this key for $1.";
      case "$(git remote get-url origin 2>/dev/null)" in http*) echo;
      echo "Its remote is over HTTPS, where no key is used: git remote set-url origin git@host:owner/repo.git";; esac
  machine-key:
    label: Machine's key
    description: Use the machine's SSH key for this project again; its own stays in ~/.ssh.
    target: project
    session: false
    place: settings
    run: >-
      git -C "$PROJECTS/$1" config --local --unset core.sshCommand; s=$?;
      if [ $s = 5 ]; then echo "$1 already uses the machine's key."; exit 0; fi; [ $s = 0 ] || exit $s;
      echo "$1 uses the machine's key again.";
      [ -f ~/.ssh/deploy_$1 ] && echo "Its own key stays, in Keys: Give it its own key takes it up again; Delete there when done with it."; exit 0
  pull-all:
    label: Pull all
    description: Pull every project that has a remote — each only when it fast-forwards.
    automatic: true
    run: >-
      cd "$PROJECTS" 2>/dev/null || { echo "No projects folder yet."; exit 0; };
      s=0; for g in */.git; do [ -e "$g" ] || continue; d=${g%/.git};
      git -C "$d" remote | grep -q . || continue;
      printf '\n== %s\n' "$d"; git -C "$d" pull --ff-only || s=1; done; exit $s
  push-all:
    label: Push all
    description: >-
      Push every project with commits its remote doesn't have yet, as of the last fetch —
      and any without an upstream, which says so.
    automatic: true
    run: >-
      cd "$PROJECTS" 2>/dev/null || { echo "No projects folder yet."; exit 0; };
      s=0; n=0; for g in */.git; do [ -e "$g" ] || continue; d=${g%/.git};
      git -C "$d" remote | grep -q . || continue;
      [ "$(git -C "$d" rev-list --count '@{u}..HEAD' 2>/dev/null)" = 0 ] && continue;
      n=1; printf '\n== %s\n' "$d"; git -C "$d" push || s=1; done;
      [ $n = 1 ] || echo "Nothing to push."; exit $s
  clone:
    label: Clone
    description: >-
      Clone a repository into the projects folder — https://…, ssh://… or git@host:path.
      Over SSH it uses this machine's own key for its user.
    ask: repo
    run: mkdir -p "$PROJECTS" && cd "$PROJECTS" && git clone -- "$1"
  # The user's own keys, never Loskai's — in Keys, a dialog of their own: each key in
  # ~/.ssh (the overview lists them, by their public halves), and what makes or tests one.
  # An account key, added to your GitHub or Forgejo account, reaches every repo you can; a
  # deploy key (a project's Own key, deploy_<project>) its repository alone. Made without a
  # passphrase, so a pull or push from the page or by Claude never stops to ask; a private
  # half never leaves the machine. The tests are automatic — their answer is the drop-down's
# Done or Failed, a refused key failing — so nothing in them may prompt: a host ssh hasn't
# met is trusted as it is first seen (StrictHostKeyChecking=accept-new; a changed key still
# fails). What makes a key, or deletes one, stays open to read.
  # The machine's account key, named: `~/.ssh/id_*`, which ssh offers every host by itself —
  # so a key added to an account works there with no ~/.ssh/config. Made (ed25519, no
  # passphrase) when there is none; otherwise the one there is renamed — its comment, the
  # name a forge lists it by — and stays the same key. Keys shows it, to copy.
  account-key:
    label: Account key
    description: >-
      Make this machine's account key, or rename the one it has — ed25519, no passphrase, so
      pulls and pushes run unattended — to add to your account on a git site.
    ask: key-comment
    automatic: true
    session: false
    place: keys
    run: >-
      command -v ssh-keygen >/dev/null || { echo "No ssh-keygen on this machine: install OpenSSH's client."; exit 1; };
      c="$1 (loskai: account)"; k=; for t in ed25519 ecdsa rsa; do [ -f ~/.ssh/id_$t ] && { k=~/.ssh/id_$t; break; }; done;
      if [ -z "$k" ]; then k=~/.ssh/id_ed25519; mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
      ssh-keygen -q -t ed25519 -N "" -C "$c" -f "$k" </dev/null || exit 1; echo "Made ${k##*/}, named $1.";
      elif ssh-keygen -y -P '' -f "$k" >/dev/null 2>&1; then
      [ -f "$k.pub" ] || ssh-keygen -y -P '' -f "$k" > "$k.pub" || exit 1;
      ssh-keygen -q -c -P '' -C "$c" -f "$k" >/dev/null || exit 1; echo "Named ${k##*/} $1.";
      else echo "${k##*/} has a passphrase: it keeps its name ($(cut -d' ' -f3- "$k.pub" 2>/dev/null))."; fi
  # One key, tried alone on a host you name — its row's Test in Keys, the host field beside it
  # filled with the platform its remotes go to, or that its comment names. The page sends
  # `<key>@<host>[:port]`. GitHub, Forgejo and GitLab name the account (or, for a deploy key,
  # its repository) in the greeting they answer an SSH login with, and ssh exits 1 even then.
  # The host is resolved once (`ssh -G`: an alias's HostName and Port), then the key goes on
  # its own (-F /dev/null, so the config adds none). Nothing may prompt (BatchMode; a new
  # host trusted as first seen), and a key with a passphrase isn't tried.
  key-on-host:
    label: Test
    description: Try this key alone on a host — does it get in there, and as whom.
    ask: key-host
    automatic: true
    session: false
    place: keys
    run: >-
      k="$HOME/.ssh/${1%%@*}"; hp=${1#*@}; h=${hp%:*}; p=; case "$hp" in *:*) p=${hp##*:};; esac;
      [ -f "$k" ] && [ -f "$k.pub" ] || { echo "No key ${1%%@*} here."; exit 1; };
      g=$(ssh -G ${p:+-p "$p"} "$h" 2>/dev/null </dev/null);
      H=$(printf '%s\n' "$g" | awk '$1=="hostname"{print $2; exit}'); P=$(printf '%s\n' "$g" | awk '$1=="port"{print $2; exit}');
      H=${H:-$h}; P=${P:-${p:-22}};
      [ "$H" = "$h" ] && echo "$h, port $P:" || echo "$h ($H, port $P):";
      n=0; t=0; ok=0; for k in "$k"; do
      name=${k##*/}; n=$((n+1));
      if ! ssh-keygen -y -P '' -f "$k" >/dev/null 2>&1; then printf '  %-24s has a passphrase: not tried\n' "$name"; continue; fi; t=$((t+1));
      out=$(ssh -F /dev/null -T -p "$P" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes
      -o ConnectTimeout=10 -i "$k" "git@$H" 2>&1 </dev/null);
      who=$(printf '%s\n' "$out" | sed -n -e '/^Hi there!/d' -e 's/^Hi there, \([^!]*\)!.*/\1/p' -e 's/^Hi \([^!]*\)!.*/\1/p'
      -e 's/^Welcome to GitLab, @\{0,1\}\([^!]*\)!.*/\1/p' | head -n 1);
      case "$out" in *"successfully authenticated"*|*"Welcome to GitLab"*) ok=$((ok+1));
      case "$out$who" in *"deploy key"*|*/*) what=" (a deploy key)";; *) what=;; esac;
      printf '  %-24s gets in%s%s\n' "$name" "${who:+ as $who}" "$what";;
      *"Host key verification failed"*) echo "  $H's host key isn't the one ssh knows — it changed, or something is in between. Nothing was tried."; exit 1;;
      *"Connection refused"*|*"timed out"*|*"Connection reset"*|*"No route to host"*|*"kex_exchange_identification"*|*"Connection closed by"*)
      if [ $t = 1 ]; then echo "  Nothing answers SSH on $H, port $P — is that the right port? A repository's Clone › SSH address shows it.";
      else echo "  $H stopped answering after $t — it may be limiting this machine (fail2ban?), so the rest weren't tried."; fi; exit 1;;
      *) printf '  %-24s refused\n' "$name";; esac;
      done;
      [ $ok -gt 0 ] || exit 1
  # What a key is for, written on it: its comment's `(loskai: …)` — account, for <host>,
  # deploy <project>, login — the mark every key Loskai makes carries, and Label puts on any
  # other. Only the comment changes (`ssh-keygen -c`): the key, and its fingerprint, stay as
  # they are, so it goes on working wherever it was added. Whatever came before the mark is
  # kept. The page sends `<key>@<what>` — `account`, `login`, `for:<host>`, `deploy:<project>`.
  label-key:
    label: Label
    description: Say what this key is for — written on the key itself, its comment; the key stays the same.
    ask: key-label
    automatic: true
    session: false
    place: keys
    run: >-
      n=${1%%@*}; k="$HOME/.ssh/$n"; what=${1#*@};
      [ -f "$k" ] && [ -f "$k.pub" ] || { echo "No key $n here."; exit 1; };
      case "$what" in for:*) l="for ${what#for:}";; deploy:*) l="deploy ${what#deploy:}";; *) l=$what;; esac;
      base=$(cut -d' ' -f3- "$k.pub" | sed 's/ *(loskai: [^)]*)$//'); [ -n "$base" ] || base="$(id -un)@$(hostname)";
      if ! ssh-keygen -y -P '' -f "$k" >/dev/null 2>&1; then echo "$n has a passphrase: label it in a Terminal, with ssh-keygen -c -f ~/.ssh/$n"; exit 1; fi;
      ssh-keygen -q -c -P '' -C "$base (loskai: $l)" -f "$k" >/dev/null || exit 1;
      echo "$n: $(cut -d' ' -f3- "$k.pub")"
  # The key's file goes; a project using it as its own goes back to the machine's key. One
  # ~/.ssh/config names is left alone — that file is yours, and Loskai doesn't edit it. The
  # forge still lists the key: Loskai can't take it off there.
  delete-key:
    label: Delete
    description: >-
      Delete this key's file; a project using it as its own goes back to the machine's key.
      Not one ~/.ssh/config names.
    target: key
    session: false
    confirm: >-
      Its file goes for good. A project using it as its own goes back to the machine's key,
      and whatever logs in with it — a git platform, another computer — stops until it has
      another. GitHub or Forgejo still lists it until you take it off there.
    run: >-
      k="$HOME/.ssh/$1";
      ssh-keygen -lf "$k.pub" >/dev/null 2>&1 || { echo "$1 isn't a key here: there is no public key ~/.ssh/$1.pub. Nothing deleted."; exit 1; };
      hosts=$(awk -v k="/$1" 'tolower($1)=="host"{h=$2} tolower($1)=="identityfile" && substr($2, length($2)-length(k)+1)==k {print h}' ~/.ssh/config 2>/dev/null | sort -u | tr '\n' ' ');
      if [ -n "$hosts" ]; then echo "~/.ssh/config names $1, for Host $hosts— take it out there first: Loskai doesn't edit that file. Nothing deleted."; exit 1; fi;
      for g in "$HOME"/*/.git "$HOME"/*/*/.git; do [ -d "$g" ] || continue; d=${g%/.git};
      case "$(git -C "$d" config --local core.sshCommand)" in *"/$1'"*|*"/$1 "*)
      git -C "$d" config --local --unset core.sshCommand && echo "${d#"$HOME"/} uses the machine's key again.";; esac; done;
      fp=$(ssh-keygen -lf "$k.pub" 2>/dev/null | cut -d' ' -f2);
      rm -f "$k" "$k.pub" && echo "Deleted $1${fp:+, $fp}." && echo &&
      echo "If you added it to GitHub or Forgejo, it is still listed there: find it by that fingerprint" &&
      echo "(an account key under your account's SSH keys, a deploy key under its repository's Deploy keys) and remove it."
