# git on the machine: who the commits made there are by, and its projects — the git repos in
# its projects folder ($PROJECTS), which Claude Code finds its projects in too: clone one,
# pull or push it, or open a shell in it. They run in the machine's terminal as its SSH
# user, so a remote over SSH uses that user's own key and asks to trust a new host there,
# and one over HTTPS asks for its login there when it needs one. That user's keys are in
# Keys: each one's Copy (the page's, from the overview), Test and Delete, a new account
# key, a key for a host, and a test on any host. A
# project can have its own commit name, email and key — a deploy key — in place of the
# machine's.
# docs/reference/tool-schema.md is the format.
name: Git
description: Your projects' git — clone, pull, push — and who commits made on it are by.
requires: [git]
settings:
  name:
    label: Name
    description: Git's global user.name — a project can set its own.
    value: git-name
    read: git config --global user.name
    write: git config --global user.name "$1"
  email:
    label: Email
    description: Git's global user.email — a project can set its own.
    value: email
    read: git config --global user.email
    write: git config --global user.email "$1"
  # A project's own, in place of the global ones; taking it off leaves the global one. Git
  # says 5 when there was nothing to take off.
  project-name:
    label: Name
    description: Who this project's commits are by — empty, the global name.
    target: project
    overrides: name
    value: git-name
    read: git -C "$PROJECTS/$1" config --local user.name
    write: git -C "$PROJECTS/$1" config --local user.name "$2"
    unset: git -C "$PROJECTS/$1" config --local --unset user.name; s=$?; [ $s = 0 ] || [ $s = 5 ]
  project-email:
    label: Email
    description: The address on this project's commits — empty, the global email.
    target: project
    overrides: email
    value: email
    read: git -C "$PROJECTS/$1" config --local user.email
    write: git -C "$PROJECTS/$1" config --local user.email "$2"
    unset: git -C "$PROJECTS/$1" config --local --unset user.email; s=$?; [ $s = 0 ] || [ $s = 5 ]
actions:
  pull:
    label: Pull
    description: Bring in what was pushed from elsewhere — only when it fast-forwards, never a merge.
    target: project
    run: cd "$PROJECTS/$1" && git pull --ff-only
  push:
    label: Push
    description: Send this project's commits to its remote.
    target: project
    run: cd "$PROJECTS/$1" && git push
  terminal:
    label: Terminal
    description: A shell in this project.
    target: project
    session: false
    run: cd "$PROJECTS/$1" && exec "${SHELL:-sh}" -l
  # A project's own key, in its settings: Machine's key takes it off again and keeps the
  # file, so Own key takes the same one up — a key already on the repository's Deploy keys.
  own-key:
    label: Own key
    description: >-
      Give this project its own SSH key — a deploy key, for its repository alone — in place
      of the machine's, made first when there is none, and shown to add to the repository.
    target: project
    session: false
    place: settings
    run: >-
      cd "$PROJECTS/$1" || exit 1;
      command -v ssh-keygen >/dev/null || { echo "No ssh-keygen on this machine: install OpenSSH's client."; exit 1; };
      k="$HOME/.ssh/deploy_$1";
      if [ -f "$k" ]; then [ -f "$k.pub" ] || ssh-keygen -y -f "$k" > "$k.pub" || exit 1;
      echo "$1's own key, kept from before:";
      else mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
      ssh-keygen -q -t ed25519 -N "" -C "$(id -un)@$(hostname) $1" -f "$k" </dev/null || exit 1;
      echo "Made $1 its own key, with no passphrase:"; fi;
      git config --local core.sshCommand "ssh -i '$k' -o IdentitiesOnly=yes" || exit 1;
      echo; cat "$k.pub"; echo;
      echo "Add it to the repository's Deploy keys (its Settings › Deploy keys), with write";
      echo "access to push. From now on git uses only this key for $1.";
      case "$(git remote get-url origin 2>/dev/null)" in http*) echo;
      echo "Its remote is over HTTPS, where no key is used: git remote set-url origin git@host:owner/repo.git";; esac
  machine-key:
    label: Machine's key
    description: Use the machine's SSH key for this project again; its own stays in ~/.ssh.
    target: project
    session: false
    place: settings
    run: >-
      git -C "$PROJECTS/$1" config --local --unset core.sshCommand; s=$?;
      if [ $s = 5 ]; then echo "$1 already uses the machine's key."; exit 0; fi; [ $s = 0 ] || exit $s;
      echo "$1 uses the machine's key again.";
      [ -f ~/.ssh/deploy_$1 ] && echo "Its own key stays, in Keys: Own key takes it up again; Delete there when done with it."; exit 0
  pull-all:
    label: Pull all
    description: Pull every project that has a remote — each only when it fast-forwards.
    run: >-
      cd "$PROJECTS" 2>/dev/null || { echo "No projects folder yet."; exit 0; };
      s=0; for g in */.git; do [ -e "$g" ] || continue; d=${g%/.git};
      git -C "$d" remote | grep -q . || continue;
      printf '\n== %s\n' "$d"; git -C "$d" pull --ff-only || s=1; done; exit $s
  push-all:
    label: Push all
    description: >-
      Push every project with commits its remote doesn't have yet, as of the last fetch —
      and any without an upstream, which says so.
    run: >-
      cd "$PROJECTS" 2>/dev/null || { echo "No projects folder yet."; exit 0; };
      s=0; n=0; for g in */.git; do [ -e "$g" ] || continue; d=${g%/.git};
      git -C "$d" remote | grep -q . || continue;
      [ "$(git -C "$d" rev-list --count '@{u}..HEAD' 2>/dev/null)" = 0 ] && continue;
      n=1; printf '\n== %s\n' "$d"; git -C "$d" push || s=1; done;
      [ $n = 1 ] || echo "Nothing to push."; exit $s
  clone:
    label: Clone
    description: >-
      Clone a repository into the projects folder — https://…, ssh://… or git@host:path.
      Over SSH it uses this machine's own key for its user.
    ask: repo
    run: mkdir -p "$PROJECTS" && cd "$PROJECTS" && git clone -- "$1"
  # The user's own keys, never Loskai's — in Keys, a dialog of their own: each key in
  # ~/.ssh (the overview lists them, by their public halves), and what makes or tests one.
  # An account key, added to your GitHub or Forgejo account, reaches every repo you can; a
  # deploy key (a project's Own key, deploy_<project>) its repository alone. Made without a
  # passphrase, so a pull or push from the page or by Claude never stops to ask; a private
  # half never leaves the machine. None is automatic: each terminal stays open to read.
  ssh-key:
    label: New account key
    description: >-
      Make this machine's account key for its user — ed25519, no passphrase, so pulls and
      pushes run unattended — and show it, to add to your GitHub or Forgejo account.
    session: false
    place: keys
    run: >-
      command -v ssh-keygen >/dev/null || { echo "No ssh-keygen on this machine: install OpenSSH's client."; exit 1; };
      k=; for t in ed25519 ecdsa rsa; do if [ -f ~/.ssh/id_$t ]; then k=~/.ssh/id_$t;
      [ -f "$k.pub" ] || ssh-keygen -y -f "$k" > "$k.pub" || exit 1; break; fi; done;
      if [ -z "$k" ]; then k=~/.ssh/id_ed25519; mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
      ssh-keygen -q -t ed25519 -N "" -C "$(id -un)@$(hostname)" -f "$k" </dev/null || exit 1;
      echo "Made a new key for $(id -un) on $(hostname), with no passphrase:";
      else echo "$(id -un)'s key on $(hostname), $k.pub:"; fi;
      echo; cat "$k.pub"; echo;
      echo "Add this line to your account — GitHub: https://github.com/settings/ssh/new";
      echo "Forgejo: <your Forgejo>/user/settings/keys"
  # A key for one host — the usual way to keep one per platform: made as ~/.ssh/<host>, and
  # the Host block that has ssh use it printed, to paste into ~/.ssh/config yourself —
  # Loskai doesn't edit that file. Keys sees it once it is there.
  host-key:
    label: New key for a host
    description: >-
      Make a key for one host — github.com, your Forgejo (host:port when its SSH isn't on
      22) — and show it, with the lines to add to ~/.ssh/config so ssh uses it there.
    ask: host
    session: false
    place: keys
    run: >-
      command -v ssh-keygen >/dev/null || { echo "No ssh-keygen on this machine: install OpenSSH's client."; exit 1; };
      h=${1%:*}; p=; case "$1" in *:*) p=${1##*:};; esac; k="$HOME/.ssh/$h";
      if [ -e "$k" ]; then echo "There is a key named $h already: Copy, on its row in Keys."; exit 1; fi;
      mkdir -p ~/.ssh && chmod 700 ~/.ssh &&
      ssh-keygen -q -t ed25519 -N "" -C "$(id -un)@$(hostname) for $h" -f "$k" </dev/null || exit 1;
      echo "Made a key for $h, with no passphrase:"; echo; cat "$k.pub"; echo;
      echo "1. Add it to your account on $h — GitHub: https://github.com/settings/ssh/new;";
      echo "   Forgejo: https://$h/user/settings/keys";
      echo "2. Add these lines to ~/.ssh/config, above any Host * block — Loskai doesn't edit it:"; echo;
      printf 'Host %s\n  IdentityFile ~/.ssh/%s\n  IdentitiesOnly yes\n' "$h" "$h"; [ -n "$p" ] && printf '  Port %s\n' "$p";
      echo; echo "3. Test key, in Keys, with $1: this key should get in there."
  # A key tried alone on a host — which get in, and as whom: GitHub, Forgejo and GitLab name
  # the account (or, for a deploy key, its repository) in the greeting they answer an SSH
  # login with, and ssh exits 1 even then. The host is resolved once (`ssh -G`: an alias's
  # HostName and Port), then each key goes on its own (-F /dev/null, so the config adds
  # none). First a connection that offers no key, so ssh can ask to trust the host's key
  # here; after it nothing may prompt (BatchMode), and a key with a passphrase is left out.
  # A host that stops answering — refused, reset, timed out — ends it: fail2ban, say, on a
  # self-hosted forge counts each refused key. Test key and Try every key share the part
  # that tries one key, word for word (test_ssh_tool checks it); they differ in which keys.
  #
  # Test key: only those meant for the host — what ssh offers it (its config's IdentityFile,
  # else ssh's own defaults), and any whose comment says it is for it ("… for github.com",
  # as New key for a host writes) — so a test makes a connection or two, not one a key.
  test-key:
    label: Test key
    description: >-
      Try the keys meant for a git host — the ones ssh offers it, and any made for it — one
      at a time, and see which get in, and as whom.
    ask: host
    session: false
    place: keys
    run: >-
      h=${1%:*}; p=; case "$1" in *:*) p=${1##*:};; esac;
      g=$(ssh -G ${p:+-p "$p"} "$h" 2>/dev/null </dev/null);
      H=$(printf '%s\n' "$g" | awk '$1=="hostname"{print $2; exit}'); P=$(printf '%s\n' "$g" | awk '$1=="port"{print $2; exit}');
      H=${H:-$h}; P=${P:-${p:-22}};
      ks=$( { printf '%s\n' "$g" | awk '$1=="identityfile"{print $2}' | sed "s,^~,$HOME,";
      for f in "$HOME"/.ssh/*.pub; do [ -f "$f" ] || continue;
      case " $(cut -d' ' -f3- "$f") " in *" for $h "*|*" for $H "*) echo "${f%.pub}";; esac; done; } | sort -u);
      [ "$H" = "$h" ] && echo "$h, port $P — the keys meant for it:" || echo "$h ($H, port $P) — the keys meant for it:";
      ssh -T -p "$P" -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
      -o ConnectTimeout=10 "git@$H" >/dev/null 2>&1;
      n=0; ok=0; for k in $ks; do [ -f "$k" ] && [ -f "$k.pub" ] || continue;
      name=${k##*/}; n=$((n+1));
      if ! ssh-keygen -y -P '' -f "$k" >/dev/null 2>&1; then printf '  %-24s has a passphrase: not tried\n' "$name"; continue; fi;
      out=$(ssh -F /dev/null -T -p "$P" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i "$k" "git@$H" 2>&1 </dev/null);
      who=$(printf '%s\n' "$out" | sed -n -e '/^Hi there!/d' -e 's/^Hi there, \([^!]*\)!.*/\1/p' -e 's/^Hi \([^!]*\)!.*/\1/p'
      -e 's/^Welcome to GitLab, @\{0,1\}\([^!]*\)!.*/\1/p' | head -n 1);
      case "$out" in *"successfully authenticated"*|*"Welcome to GitLab"*) ok=$((ok+1));
      case "$out$who" in *"deploy key"*|*/*) what=" (a deploy key)";; *) what=;; esac;
      printf '  %-24s gets in%s%s\n' "$name" "${who:+ as $who}" "$what";;
      *"Host key verification failed"*) echo "  ssh doesn't trust $H's host key, so nothing was tried."; exit 1;;
      *"Connection refused"*|*"timed out"*|*"Connection reset"*|*"No route to host"*|*"kex_exchange_identification"*|*"Connection closed by"*)
      echo "  $H stopped answering after $n — it may be limiting this machine (fail2ban?), so the rest weren't tried."; exit 1;;
      *) printf '  %-24s refused\n' "$name";; esac;
      done;
      [ $n = 0 ] && { echo "  None here: ssh offers it no key in ~/.ssh, and none is made for it."; echo;
      echo "Try every key finds out which get in — or New key for a host makes one."; exit 1; };
      [ $ok -gt 0 ] || { echo; echo "None gets in: add one to your account there (Copy, on its row), or Try every key."; exit 1; }
  # Try every key: each key in ~/.ssh, at most 10 — to find which a host takes when nothing
  # says. A key a host refuses is a failed login there; this one is asked for.
  every-key:
    label: Try every key
    description: >-
      Try every key in ~/.ssh on a git host, one at a time — at most 10, stopping if it stops
      answering. Each refused key is a failed login there: on a self-hosted forge with
      fail2ban, a few of them can get this machine banned for a while.
    ask: host
    session: false
    place: keys
    run: >-
      h=${1%:*}; p=; case "$1" in *:*) p=${1##*:};; esac;
      g=$(ssh -G ${p:+-p "$p"} "$h" 2>/dev/null </dev/null);
      H=$(printf '%s\n' "$g" | awk '$1=="hostname"{print $2; exit}'); P=$(printf '%s\n' "$g" | awk '$1=="port"{print $2; exit}');
      H=${H:-$h}; P=${P:-${p:-22}};
      [ "$H" = "$h" ] && echo "$h, port $P — every key:" || echo "$h ($H, port $P) — every key:";
      ssh -T -p "$P" -o PubkeyAuthentication=no -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
      -o ConnectTimeout=10 "git@$H" >/dev/null 2>&1;
      n=0; ok=0; for f in "$HOME"/.ssh/*.pub; do [ -f "$f" ] || continue; k=${f%.pub}; [ -f "$k" ] || continue;
      [ $n -ge 10 ] && { echo "  Stopped at 10 keys."; break; };
      name=${k##*/}; n=$((n+1));
      if ! ssh-keygen -y -P '' -f "$k" >/dev/null 2>&1; then printf '  %-24s has a passphrase: not tried\n' "$name"; continue; fi;
      out=$(ssh -F /dev/null -T -p "$P" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 -i "$k" "git@$H" 2>&1 </dev/null);
      who=$(printf '%s\n' "$out" | sed -n -e '/^Hi there!/d' -e 's/^Hi there, \([^!]*\)!.*/\1/p' -e 's/^Hi \([^!]*\)!.*/\1/p'
      -e 's/^Welcome to GitLab, @\{0,1\}\([^!]*\)!.*/\1/p' | head -n 1);
      case "$out" in *"successfully authenticated"*|*"Welcome to GitLab"*) ok=$((ok+1));
      case "$out$who" in *"deploy key"*|*/*) what=" (a deploy key)";; *) what=;; esac;
      printf '  %-24s gets in%s%s\n' "$name" "${who:+ as $who}" "$what";;
      *"Host key verification failed"*) echo "  ssh doesn't trust $H's host key, so nothing was tried."; exit 1;;
      *"Connection refused"*|*"timed out"*|*"Connection reset"*|*"No route to host"*|*"kex_exchange_identification"*|*"Connection closed by"*)
      echo "  $H stopped answering after $n — it may be limiting this machine (fail2ban?), so the rest weren't tried."; exit 1;;
      *) printf '  %-24s refused\n' "$name";; esac;
      done;
      [ $n = 0 ] && { echo "  No key in ~/.ssh yet."; exit 1; };
      [ $ok -gt 0 ] || { echo; echo "No key here gets in: add one to your account there (Copy, on its row)."; exit 1; }
  # Each remote the key is for, as the list shows it: in every repo in the home folder and
  # its submodules, a remote over SSH whose key is this one — the project's own (its
  # core.sshCommand), else what ssh offers its host (`ssh -G`: aliases, Host *, Include) —
  # asked for its HEAD with this key alone: the read a pull or push does first. Only SSH
  # addresses: another transport (git's ext::) could run a command.
  try-key:
    label: Test
    description: >-
      Try this key on each remote it is for — in every project and submodule, through
      ~/.ssh/config too — with read access, as a pull needs.
    target: key
    session: false
    run: >-
      k="$HOME/.ssh/$1"; [ -f "$k" ] || { echo "No key $1 here."; exit 1; };
      n=0; s=0;
      for g in "$HOME"/*/.git "$HOME"/*/*/.git; do [ -d "$g" ] || continue; d=${g%/.git};
      own=$(git -C "$d" config --local core.sshCommand);
      for c in "$g/config" "$g"/modules/*/config "$g"/modules/*/*/config "$g"/modules/*/*/*/config; do
      [ -f "$c" ] || continue; m=${c#"$g"/}; m=${m#modules/}; m=${m%config}; m=${m%/};
      for line in $(git config -f "$c" --get-regexp '^remote[.].*[.](url|pushurl)$' | tr ' ' '|'); do
      what=${line%%|*}; u=${line#*|};
      case "$u" in ssh://*) h=${u#ssh://}; h=${h#*@}; h=${h%%/*}; h=${h%%:*};; *://*) continue;; *@*:*) h=${u%%:*}; h=${h#*@};; *) continue;; esac;
      if [ -z "$m" ] && [ -n "$own" ]; then case "$own" in *"/$1'"*|*"/$1 "*) ;; *) continue;; esac;
      else ssh -G "$h" 2>/dev/null </dev/null | grep -qi "^identityfile .*/$1\$" || continue; fi;
      n=$((n+1)); case "$what" in *pushurl) way=push;; *) way=fetch;; esac;
      printf '%s%s — %s %s: ' "${d#"$HOME"/}" "${m:+ › $m}" "$way" "$u";
      if GIT_SSH_COMMAND="ssh -i '$k' -o IdentitiesOnly=yes" git ls-remote -q "$u" HEAD >/dev/null </dev/null;
      then echo gets in; else echo refused; s=1; fi; done; done; done;
      [ $n = 0 ] && echo "No remote here goes over SSH with $1. Test key, under the list, takes a host.";
      exit $s
  # The key's file goes; a project using it as its own goes back to the machine's key. One
  # ~/.ssh/config names is left alone — that file is yours, and Loskai doesn't edit it. The
  # forge still lists the key: Loskai can't take it off there.
  delete-key:
    label: Delete
    description: >-
      Delete this key's file; a project using it as its own goes back to the machine's key.
      Not one ~/.ssh/config names.
    target: key
    session: false
    confirm: >-
      Its file goes for good, and a project using it as its own goes back to the machine's
      key. GitHub or Forgejo still lists it until you take it off there.
    run: >-
      k="$HOME/.ssh/$1"; [ -f "$k.pub" ] || [ -f "$k" ] || { echo "No key $1 here."; exit 1; };
      hosts=$(awk -v k="/$1" 'tolower($1)=="host"{h=$2} tolower($1)=="identityfile" && substr($2, length($2)-length(k)+1)==k {print h}' ~/.ssh/config 2>/dev/null | sort -u | tr '\n' ' ');
      if [ -n "$hosts" ]; then echo "~/.ssh/config names $1, for Host $hosts— take it out there first: Loskai doesn't edit that file. Nothing deleted."; exit 1; fi;
      for g in "$HOME"/*/.git "$HOME"/*/*/.git; do [ -d "$g" ] || continue; d=${g%/.git};
      case "$(git -C "$d" config --local core.sshCommand)" in *"/$1'"*|*"/$1 "*)
      git -C "$d" config --local --unset core.sshCommand && echo "${d#"$HOME"/} uses the machine's key again.";; esac; done;
      rm -f "$k" "$k.pub" && echo "Deleted $1." &&
      echo "GitHub or Forgejo still lists it: take it off there too — an account key under your account's SSH keys, a deploy key under its repository's Deploy keys."
