[project]
name = "loskai"
version = "0.1.0"
description = "Control plane for your homelab — Docker, Caddy, AdGuard, and WireGuard in one image"
readme = "README.md"
authors = [
    { name = "sunde", email = "295954441+simplysunde@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic-settings",
    "sse-starlette",
    "argon2-cffi",
    "itsdangerous",
    "docker>=7.2.0",
    "pyyaml>=6.0.3",
    "asyncssh[bcrypt]>=2.24.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# conftest lowers the SSH key's bcrypt rounds to keep the suite fast; bcrypt says so.
filterwarnings = ["ignore:.*bcrypt.kdf.. called with only:UserWarning"]
