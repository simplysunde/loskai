# All-in-Docker alternative (no Proxmox/LXC): Loskai + Caddy + AdGuard as containers on one
# host. Also the basis for the Tier-3 test rig. See docs/deployment.md for env vars, the
# co-located port notes (AdGuard :53 vs the host resolver), and why CADDY_HOST_IP is
# required here. Copy .env.example to .env first.

services:
  caddy:
    build: ./caddy # stock Caddy + internal CA by default; see caddy/Dockerfile for the ACME build
    container_name: caddy
    ports:
      - "80:80" # certificate-onboarding page (install the internal root once per device)
      - "443:443"
      # :2019 (admin) stays internal — Loskai reaches it as caddy:2019.
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:?set BASE_DOMAIN}
      # DUCKDNS_TOKEN is only needed for the future public-ACME path (see caddy/Caddyfile +
      # caddy/Dockerfile). The default internal CA needs no token — leave this commented.
      #- DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
    volumes:
      - caddy-data:/data # certs + the autosaved config (survives restarts)
      - caddy-config:/config
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000" # first-run setup UI; afterwards reach it through Caddy
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  loskai:
    build: .
    image: loskai:latest
    container_name: loskai
    depends_on:
      - caddy
      - adguard
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_DIR:-/opt/stacks}:${STACKS_DIR:-/opt/stacks}
      - ./loskai-settings:/opt/loskai
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - ADGUARD_URL=http://adguard:3000
      - ADGUARD_USER=${ADGUARD_USER:-}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD:-}
      - WIREGUARD_DASHBOARD_URL=${WIREGUARD_DASHBOARD_URL:-}
      - BASE_DOMAIN=${BASE_DOMAIN:?set BASE_DOMAIN}
      - LOSKAI_PASSWORD=${LOSKAI_PASSWORD:-}
      - STACKS_DIR=${STACKS_DIR:-/opt/stacks}
      - RECIPES_REPO_URL=${RECIPES_REPO_URL:-} # overrides the image default; unset = image default
      # Required in this mode: the host LAN IP where Caddy's :443 is published.
      - CADDY_HOST_IP=${CADDY_HOST_IP:?set CADDY_HOST_IP to the host's LAN IP}
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  adguard-work:
  adguard-conf:
