# Preferred setup: Loskai on the Docker host; Caddy and AdGuard native on two separate LXCs over the LAN.
# See docs/deployment.md for env vars, the STACKS_DIR same-path mount, the settings-volume
# coupling, and cold start. Copy .env.example to .env first.

services:
  loskai:
    build: .
    image: loskai:latest # `docker compose build` tags it here
    container_name: loskai
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_DIR:-/opt/stacks}:${STACKS_DIR:-/opt/stacks}
      - ./loskai-settings:/opt/loskai
    environment:
      - CADDY_ADMIN_URL=${CADDY_ADMIN_URL:-}
      - ADGUARD_URL=${ADGUARD_URL:-}
      - ADGUARD_USER=${ADGUARD_USER:-}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD:-}
      - WIREGUARD_DASHBOARD_URL=${WIREGUARD_DASHBOARD_URL:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-}
      # This Docker host's LAN IP — auto-fills container route upstreams as <host_ip>:<port>
      # (Caddy on its own LXC can't resolve container names). Optional; blank = fill in per route.
      - HOST_IP=${HOST_IP:-}
      - LOSKAI_PASSWORD=${LOSKAI_PASSWORD:-}
      - STACKS_DIR=${STACKS_DIR:-/opt/stacks}
      - RECIPES_REPO_URL=${RECIPES_REPO_URL:-} # overrides the image default; unset = image default
    restart: unless-stopped
