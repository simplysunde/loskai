# Split-DNS layout (B): Caddy + Loskai here on the Docker host, AdGuard on its own small
# always-on box over the LAN. The recommended layout without Proxmox — see
# docs/guides/topologies.md for why, and docs/guides/deployment.md for env vars and volumes.
# Set AdGuard up on the other box first, then put ADGUARD_URL (its LAN IP) and CADDY_HOST_IP
# (this host's LAN IP) in a .env. Walkthrough:
# docs/guides/install.md#no-proxmox-install-layout-b--split-dns
#
#   mkdir -p data stacks && docker compose -f compose.caddy-loskai.yml up -d   # first run
#   docker compose -f compose.caddy-loskai.yml pull && \
#     docker compose -f compose.caddy-loskai.yml up -d                         # update

services:
  caddy:
    image: ${LOSKAI_REGISTRY:-ghcr.io/simplysunde}/loskai-caddy:${LOSKAI_VERSION:-latest} # caddy/Dockerfile
    container_name: caddy
    ports:
      - "80:80" # certificate-onboarding page (install the internal root once per device)
      - "443:443"
      # :2019 (admin) stays internal — Loskai reaches it as caddy:2019.
    volumes:
      - caddy-data:/data # the internal CA and its certificates
      - caddy-config:/config # the saved config, routes included — Caddy starts from it (--resume)
    networks:
      - default # Loskai reaches the admin API over this one
      - loskai-edge # and managed stacks join this one to be routed — see below
    restart: unless-stopped

  loskai:
    image: ${LOSKAI_REGISTRY:-ghcr.io/simplysunde}/loskai:${LOSKAI_VERSION:-latest}
    container_name: loskai
    depends_on:
      - caddy
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Managed stacks — the SAME path on both sides, deliberately. Loskai runs
      # `docker compose` inside this container but the daemon is on the host, so a
      # managed stack's relative binds (./data:/data) are resolved against the path the
      # container sees and then handed to the host daemon. Differing paths would put
      # every managed stack's volumes somewhere that doesn't exist on the host.
      # Default is ./stacks beside this file — which is why compose must be run FROM
      # this directory (${PWD}); `deploy.sh` cd's here first. Running it with `-f` from
      # somewhere else, or from a systemd unit with no WorkingDirectory, would point
      # stacks at <that directory>/stacks instead. Set STACKS_DIR to an absolute path
      # to pin it and stop caring where you invoke compose from.
      - ${STACKS_DIR:-${PWD}/stacks}:${STACKS_DIR:-${PWD}/stacks}
      - ./data:/data # Loskai's own state: settings.json, instances.json, recipes/
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      # AdGuard runs on the other box, so these are a LAN address and its credentials —
      # not a container name. Optional: leave unset and fill them in from Settings > Network.
      - ADGUARD_URL=${ADGUARD_URL:-}
      - ADGUARD_USER=${ADGUARD_USER:-}
      - ADGUARD_PASSWORD=${ADGUARD_PASSWORD:-}
      - WIREGUARD_DASHBOARD_URL=${WIREGUARD_DASHBOARD_URL:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-}
      - LOSKAI_PASSWORD=${LOSKAI_PASSWORD:-}
      - LOSKAI_USERNAME=${LOSKAI_USERNAME:-}
      # Optional; each is also in Settings, and set here it wins (docs/guides/deployment.md).
      - SESSION_IDLE_MINUTES=${SESSION_IDLE_MINUTES:-}
      - SSH_UNLOCK_MINUTES=${SSH_UNLOCK_MINUTES:-}
      - CERTIFICATE_TAB=${CERTIFICATE_TAB:-}
      - STACKS_DIR=${STACKS_DIR:-${PWD}/stacks}
      # Must equal the `./data:/data` mount above. Passed explicitly so the mount and
      # the path the app writes to can't drift apart; the code default is the repo's data/.
      - LOSKAI_DATA_DIR=/data
      # Required in this mode: Caddy's admin URL is a hostname, so the DNS answer IP can't
      # be derived from it. This host's LAN IP, where Caddy's :443 is published.
      - CADDY_HOST_IP=${CADDY_HOST_IP:?set CADDY_HOST_IP to this host's LAN IP}
      # The same address in this layout — Caddy runs here. It fills the upstream for a
      # container that is *not* on loskai-edge, as <host_ip>:<published-port>.
      - HOST_IP=${HOST_IP:-}
    healthcheck:
      # The login page's own question: public, cheap, and answered once the app is up.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/auth/status"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

networks:
  # Declared only because `caddy` names it explicitly above — same project-scoped network
  # Compose would have created implicitly. It is what Loskai reaches caddy:2019 over.
  default:

  # The shared edge network, and the one thing no other layout can do: a managed stack that
  # joins it is reachable from Caddy by service name, so it never has to publish a host port.
  # Loskai detects that per container and pre-fills `name:port` instead of an IP.
  #
  # `name:` pins the real network name — Compose would otherwise prefix the project — which
  # is what lets a stack in another project attach to it:
  #
  #   networks:
  #     loskai-edge:
  #       external: true
  #
  # Compose creates it with this stack, so bring this stack up before one that declares it
  # external. See docs/guides/topologies.md for the full stanza.
  loskai-edge:
    name: loskai-edge

volumes:
  caddy-data:
  caddy-config:
